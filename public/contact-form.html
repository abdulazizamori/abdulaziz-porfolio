<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Portfolio contact form</title></head>
  <body>
    <!-- Static form blueprint required for Netlify Forms with Next.js Runtime v5. -->
    <form name="portfolio-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="portfolio-contact">
      <input type="hidden" name="subject" value="New portfolio enquiry">
      <input name="bot-field">
      <input name="name">
      <input type="email" name="email">
      <input name="company">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
